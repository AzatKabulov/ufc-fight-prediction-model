<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="36" fill="#0a0a0a"/>
  <rect width="192" height="192" rx="36" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c97e"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
  </defs>
  <!-- Octagon shape -->
  <polygon points="96,24 140,40 164,80 164,112 140,152 96,168 52,152 28,112 28,80 52,40" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.8"/>
  <!-- IQ text -->
  <text x="96" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="url(#accent)">IQ</text>
  <!-- Fight subtitle -->
  <text x="96" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#888" letter-spacing="6">FIGHT</text>
  <!-- Small fists icon hint -->
  <circle cx="60" cy="148" r="4" fill="#e8c97e" opacity="0.4"/>
  <circle cx="132" cy="148" r="4" fill="#e8c97e" opacity="0.4"/>
</svg>
